<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1010" viewBox="0 0 1120 1010">
<title>Sony steering-remote prototype: isolated five-tap resistor ladder</title>
<style>text{font-family:Arial,sans-serif;fill:#172033} .small{font-size:12px} .wire{fill:none;stroke-width:2.4;stroke-linejoin:round}</style>
<rect width="1120" height="1010" fill="white"/>
<text x="35" y="40" text-anchor="start" style="font-size:26px">Sony steering-remote prototype</text>
<text x="35" y="65" text-anchor="start" style="font-size:14px;fill:#a33">DESIGN ONLY - bench with Sony disconnected; no hardware measurements yet</text>
<text x="35" y="110" text-anchor="start" style="font-size:19px">Each of five control inputs</text>
<text x="35" y="135" text-anchor="start" style="font-size:13px">Repeat for U1 through U5; GPIO HIGH closes that switch.</text>
<text x="40" y="210" text-anchor="start" style="font-size:14px">GPIO</text>
<path class="wire" stroke="#087f8c" d="M90,205 L145,205"/>
<path class="wire" stroke="#087f8c" d="M145,205 L197.5,205.0"/>
<path class="wire" stroke="#087f8c" d="M227.5,205.0 L280,205"/>
<rect x="-15" y="-5" width="30" height="10" fill="white" stroke="#087f8c" stroke-width="2" transform="translate(212.5,205.0) rotate(0.0)"/>
<text x="221.5" y="197.0" text-anchor="start" style="font-size:12px;fill:#087f8c">220 ohm</text>
<circle cx="115" cy="205" r="4" fill="#087f8c"/>
<path class="wire" stroke="#087f8c" d="M115,205 L115.0,252.5"/>
<path class="wire" stroke="#087f8c" d="M115.0,282.5 L115,330"/>
<rect x="-15" y="-5" width="30" height="10" fill="white" stroke="#087f8c" stroke-width="2" transform="translate(115.0,267.5) rotate(90.0)"/>
<text x="124.0" y="259.5" text-anchor="start" style="font-size:12px;fill:#087f8c">47k pulldown</text>
<path class="wire" stroke="#087f8c" d="M280,205 L315,205"/>
<rect x="315" y="175" width="130" height="135" rx="5" fill="#eef6f8" stroke="#087f8c"/>
<text x="330" y="200" text-anchor="start" style="font-size:12px">1  LED anode</text>
<text x="330" y="280" text-anchor="start" style="font-size:12px">2  cathode</text>
<path class="wire" stroke="#087f8c" d="M315,285 L280,285"/>
<path class="wire" stroke="#087f8c" d="M280,285 L280,330"/>
<path class="wire" stroke="#087f8c" d="M115,330 L280,330"/>
<text x="120" y="355" text-anchor="start" style="font-size:14px;fill:#087f8c">XIAO GND only</text>
<text x="35" y="410" text-anchor="start" style="font-size:18px">Logic drive</text>
<text x="35" y="440" text-anchor="start" style="font-size:13px">3.3V GPIO; configure 12mA drive for this future backend.</text>
<text x="35" y="463" text-anchor="start" style="font-size:13px">220 ohm gives about 9.8mA LED current at nominal voltage.</text>
<text x="35" y="486" text-anchor="start" style="font-size:13px">One command active at a time; LOW / reset = open.</text>
<text x="35" y="509" text-anchor="start" style="font-size:13px">PhotoMOS input is LED-driven; no VCC rail or capacitor.</text>
<text x="35" y="532" text-anchor="start" style="font-size:13px">Manual mock-up: GPIO cable unplugged; jumper 3V3</text>
<text x="35" y="555" text-anchor="start" style="font-size:13px">to one J1 command input, with J1-1 tied to XIAO GND.</text>
<text x="35" y="625" text-anchor="start" style="font-size:18px">Cable J1 - controller side</text>
<text x="40" y="655" text-anchor="start" style="font-size:13px">1: GND  /  LOGIC_GND</text>
<text x="40" y="680" text-anchor="start" style="font-size:13px">2: D0  /  MUTE_ATT</text>
<text x="40" y="705" text-anchor="start" style="font-size:13px">3: D1  /  NEXT_TRACK</text>
<text x="40" y="730" text-anchor="start" style="font-size:13px">4: D2  /  PREVIOUS_TRACK</text>
<text x="40" y="755" text-anchor="start" style="font-size:13px">5: D3  /  VOLUME_UP</text>
<text x="40" y="780" text-anchor="start" style="font-size:13px">6: D6  /  VOLUME_DOWN</text>
<text x="35" y="840" text-anchor="start" style="font-size:14px">Keep input/output wiring separate on the board.</text>
<text x="35" y="864" text-anchor="start" style="font-size:14px">Do not join XIAO GND to Sony remote ground here.</text>
<text x="35" y="888" text-anchor="start" style="font-size:13px">Vehicle supplies may share ground elsewhere.</text>
<path class="wire" stroke="#bac3d0" stroke-dasharray="6 5" d="M515,105 L515,925"/>
<text x="570" y="110" text-anchor="start" style="font-size:19px">Sony side - passive resistance output</text>
<text x="570" y="145" text-anchor="start" style="font-size:14px;fill:#b45309">J2-1: Input 1</text>
<circle cx="625" cy="170" r="4" fill="#b45309"/>
<path class="wire" stroke="#b45309" d="M625,170 L625.0,185.0"/>
<path class="wire" stroke="#b45309" d="M625.0,215.0 L625,230"/>
<rect x="-15" y="-5" width="30" height="10" fill="white" stroke="#b45309" stroke-width="2" transform="translate(625.0,200.0) rotate(90.0)"/>
<text x="634.0" y="192.0" text-anchor="start" style="font-size:12px;fill:#b45309">R1: 2.2k</text>
<path class="wire" stroke="#b45309" d="M625,230 L625.0,245.0"/>
<path class="wire" stroke="#b45309" d="M625.0,275.0 L625,290"/>
<rect x="-15" y="-5" width="30" height="10" fill="white" stroke="#b45309" stroke-width="2" transform="translate(625.0,260.0) rotate(90.0)"/>
<text x="634.0" y="252.0" text-anchor="start" style="font-size:12px;fill:#b45309">R2: 2.2k</text>
<path class="wire" stroke="#b45309" d="M625,290 L625.0,305.0"/>
<path class="wire" stroke="#b45309" d="M625.0,335.0 L625,350"/>
<rect x="-15" y="-5" width="30" height="10" fill="white" stroke="#b45309" stroke-width="2" transform="translate(625.0,320.0) rotate(90.0)"/>
<text x="634.0" y="312.0" text-anchor="start" style="font-size:12px;fill:#b45309">R3: 2.2k</text>
<path class="wire" stroke="#b45309" d="M625,350 L625.0,365.0"/>
<path class="wire" stroke="#b45309" d="M625.0,395.0 L625,410"/>
<rect x="-15" y="-5" width="30" height="10" fill="white" stroke="#b45309" stroke-width="2" transform="translate(625.0,380.0) rotate(90.0)"/>
<text x="634.0" y="372.0" text-anchor="start" style="font-size:12px;fill:#b45309">R4: 2.2k</text>
<path class="wire" stroke="#b45309" d="M625,410 L625.0,440.0"/>
<path class="wire" stroke="#b45309" d="M625.0,470.0 L625,500"/>
<rect x="-15" y="-5" width="30" height="10" fill="white" stroke="#b45309" stroke-width="2" transform="translate(625.0,455.0) rotate(90.0)"/>
<text x="634.0" y="447.0" text-anchor="start" style="font-size:12px;fill:#b45309">R5: 3.3k</text>
<path class="wire" stroke="#b45309" d="M625,500 L625.0,530.0"/>
<path class="wire" stroke="#b45309" d="M625.0,560.0 L625,590"/>
<rect x="-15" y="-5" width="30" height="10" fill="white" stroke="#b45309" stroke-width="2" transform="translate(625.0,545.0) rotate(90.0)"/>
<text x="634.0" y="537.0" text-anchor="start" style="font-size:12px;fill:#b45309">R6: 4.7k</text>
<path class="wire" stroke="#b45309" d="M625,590 L625.0,620.0"/>
<path class="wire" stroke="#b45309" d="M625.0,650.0 L625,680"/>
<rect x="-15" y="-5" width="30" height="10" fill="white" stroke="#b45309" stroke-width="2" transform="translate(625.0,635.0) rotate(90.0)"/>
<text x="634.0" y="627.0" text-anchor="start" style="font-size:12px;fill:#b45309">R7: 6.8k</text>
<circle cx="625" cy="290" r="4" fill="#b45309"/>
<path class="wire" stroke="#b45309" d="M625,290 L790,290"/>
<rect x="790" y="270" width="100" height="40" rx="4" fill="#fff8ed" stroke="#b45309"/>
<text x="840" y="295" text-anchor="middle" style="font-size:13px;fill:#b45309">U1  N.O.</text>
<text x="790" y="260" text-anchor="start" style="font-size:13px">Mute / ATT: 4.40k</text>
<text x="775" y="295" text-anchor="start" style="font-size:11px">4</text>
<text x="900" y="295" text-anchor="start" style="font-size:11px">3</text>
<path class="wire" stroke="#b45309" d="M890,290 L1010,290"/>
<circle cx="1010" cy="290" r="4" fill="#b45309"/>
<circle cx="625" cy="410" r="4" fill="#b45309"/>
<path class="wire" stroke="#b45309" d="M625,410 L790,410"/>
<rect x="790" y="390" width="100" height="40" rx="4" fill="#fff8ed" stroke="#b45309"/>
<text x="840" y="415" text-anchor="middle" style="font-size:13px;fill:#b45309">U2  N.O.</text>
<text x="790" y="380" text-anchor="start" style="font-size:13px">Next track: 8.80k</text>
<text x="775" y="415" text-anchor="start" style="font-size:11px">4</text>
<text x="900" y="415" text-anchor="start" style="font-size:11px">3</text>
<path class="wire" stroke="#b45309" d="M890,410 L1010,410"/>
<circle cx="1010" cy="410" r="4" fill="#b45309"/>
<circle cx="625" cy="500" r="4" fill="#b45309"/>
<path class="wire" stroke="#b45309" d="M625,500 L790,500"/>
<rect x="790" y="480" width="100" height="40" rx="4" fill="#fff8ed" stroke="#b45309"/>
<text x="840" y="505" text-anchor="middle" style="font-size:13px;fill:#b45309">U3  N.O.</text>
<text x="790" y="470" text-anchor="start" style="font-size:13px">Previous track: 12.10k</text>
<text x="775" y="505" text-anchor="start" style="font-size:11px">4</text>
<text x="900" y="505" text-anchor="start" style="font-size:11px">3</text>
<path class="wire" stroke="#b45309" d="M890,500 L1010,500"/>
<circle cx="1010" cy="500" r="4" fill="#b45309"/>
<circle cx="625" cy="590" r="4" fill="#b45309"/>
<path class="wire" stroke="#b45309" d="M625,590 L790,590"/>
<rect x="790" y="570" width="100" height="40" rx="4" fill="#fff8ed" stroke="#b45309"/>
<text x="840" y="595" text-anchor="middle" style="font-size:13px;fill:#b45309">U4  N.O.</text>
<text x="790" y="560" text-anchor="start" style="font-size:13px">Volume up: 16.80k</text>
<text x="775" y="595" text-anchor="start" style="font-size:11px">4</text>
<text x="900" y="595" text-anchor="start" style="font-size:11px">3</text>
<path class="wire" stroke="#b45309" d="M890,590 L1010,590"/>
<circle cx="1010" cy="590" r="4" fill="#b45309"/>
<circle cx="625" cy="680" r="4" fill="#b45309"/>
<path class="wire" stroke="#b45309" d="M625,680 L790,680"/>
<rect x="790" y="660" width="100" height="40" rx="4" fill="#fff8ed" stroke="#b45309"/>
<text x="840" y="685" text-anchor="middle" style="font-size:13px;fill:#b45309">U5  N.O.</text>
<text x="790" y="650" text-anchor="start" style="font-size:13px">Volume down: 23.60k</text>
<text x="775" y="685" text-anchor="start" style="font-size:11px">4</text>
<text x="900" y="685" text-anchor="start" style="font-size:11px">3</text>
<path class="wire" stroke="#b45309" d="M890,680 L1010,680"/>
<circle cx="1010" cy="680" r="4" fill="#b45309"/>
<path class="wire" stroke="#b45309" d="M1010,290 L1010,760"/>
<text x="785" y="790" text-anchor="start" style="font-size:15px;fill:#b45309">J2-2: ST Remote GND</text>
<text x="570" y="835" text-anchor="start" style="font-size:13px">All U1-U5: AQY212EH, normally-open PhotoMOS (DIP-4).</text>
<text x="570" y="860" text-anchor="start" style="font-size:13px">Pins 1/2 are the isolated LED input; 3/4 are the output contact.</text>
<text x="570" y="885" text-anchor="start" style="font-size:13px">Input 2 stays insulated and unused. No vehicle 12V connection.</text>
<text x="35" y="960" text-anchor="start" style="font-size:13px">Seven 1% ladder resistors produce the five reference values. Actual readings also include contact resistance and leakage.</text>
<text x="35" y="985" text-anchor="start" style="font-size:13px">This prototype covers steering-remote audio commands; camera-trigger circuitry is a separate design.</text>
</svg>
